name: Send US Market Telegram Briefing

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/telegram-briefing.yml"
      - "scripts/send_telegram_briefing.py"
      - "server.py"
  schedule:
    # 한국시간 평일 오전 7시 30분 = 전날 오후 10시 30분 UTC
    - cron: "30 22 * * 0-4"

permissions:
  contents: read

concurrency:
  group: telegram-us-market-briefing
  cancel-in-progress: true

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Refresh latest market snapshot
        run: python3 server.py --us-snapshot telegram-snapshot.json

      - name: Send briefing to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 scripts/send_telegram_briefing.py --snapshot telegram-snapshot.json
