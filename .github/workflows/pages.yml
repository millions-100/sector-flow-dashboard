name: Deploy Sector Flow to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 한국장(09:00~15:30 KST)과 미국장 전후(22:00~11:30 KST)를 30분 간격으로 갱신
    - cron: "*/30 0-6 * * 1-5"
    - cron: "*/30 13-23 * * 1-5"
    - cron: "*/30 0-2 * * 2-6"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Refresh latest market snapshot
        run: python3 server.py --snapshot dist/market-snapshot.json
      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
